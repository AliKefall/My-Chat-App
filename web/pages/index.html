
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App 🚀</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #messages { list-style: none; padding: 0; }
    #messages li { margin: 5px 0; padding: 8px; border-radius: 6px; background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Chat App 🚀</h1>

  <div>
    <input id="msgInput" placeholder="Mesaj yaz..." />
    <button onclick="sendMessage()">Gönder</button>
  </div>

  <ul id="messages"></ul>

  <script>
    // JWT token'i login sonrası localStorage'a kaydettiğimizi varsayıyoruz
    const token = localStorage.getItem("token"); 
    if (!token) {
      alert("Önce giriş yapmalısınız!");
      window.location.href = "/login.html";
    }

    // WebSocket bağlantısı (token query param ile)
    const socket = new WebSocket(`ws://localhost:8080/ws?token=${token}`);

    socket.onopen = () => {
      console.log("✅ WebSocket bağlantısı kuruldu");
    };

    socket.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        const li = document.createElement("li");
        li.textContent = `${msg.user}: ${msg.message}`;
        document.getElementById("messages").appendChild(li);
      } catch (err) {
        console.error("Mesaj parse edilemedi:", event.data);
      }
    };

    socket.onclose = () => {
      console.log("❌ WebSocket bağlantısı kapandı");
    };

    function sendMessage() {
      const input = document.getElementById("msgInput");
      if (input.value.trim() === "") return;

      const msgObj = { message: input.value };
      socket.send(JSON.stringify(msgObj)); // JSON olarak gönder
      input.value = "";
    }
  </script>
</body>
</html>
